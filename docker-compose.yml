services:
  mongodb:
    image: mongo:8.0
    container_name: university-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - university_mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: university-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - university_redis_data:/data

volumes:
  university_mongo_data:
  university_redis_data:
